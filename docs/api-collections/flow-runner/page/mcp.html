<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>API flow runner</title>
<link rel="stylesheet" href="css/diagram.css">
<link rel="stylesheet" href="css/step.css">
<link rel="stylesheet" href="css/flow-map.css">

<body>
<h1>API flow runner</h1>
<p>Served by the running app when <code>marketplace.dev-tools.enabled</code> is on.</p>
<nav class="page-tabs" role="tablist" aria-label="API">

</nav>
<p><a href="postman/marketplace-mcp.postman_collection.json">Postman collection (MCP)</a></p>

<section id="catalog"></section>

<section id="admin-account"></section>

<script type="module" src="js/mcp-page.js"></script>
