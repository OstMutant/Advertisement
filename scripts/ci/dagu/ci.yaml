# ── Header ──────────────────────────────────────────────────────────────────
# Description: The "ci" DAG -- build (reactor compile+install, reused by every later stage) ->
#   unit/integration/e2e/api_flows/archunit_metrics/lint/shellcheck in parallel, sonar after
#   unit+integration -> pipeline_metrics -> docs.
#   The api_flows stage runs the API collection flows once per role for the REST and the MCP
#   collection on its own isolated stack. Loaded by Dagu's server (scripts/ci/docker-entrypoint.sh's
#   `dagu start-all --dags scripts/ci/dagu`) and triggered either from Dagu's own web UI ("Start" button) or via
#   `dagu start <this-file-path>` (a bare DAG name resolves against $DAGU_HOME/dags instead -- see
#   DECISIONS.md).
# Usage: triggered via scripts/ci/run.sh, or the "Start" button on Dagu's web UI -- never edited
#   to change a single run's behavior, use the params below instead.
# Uses: bash, mvn (via build-and-test.sh), docker, python3 (pipeline-metrics.py), shellcheck.
# Env: MAVEN_CACHE_VOLUME=ci-maven-cache, VAADIN_CACHE_VOLUME=ci-vaadin-cache, TEST_REPORTS_VOLUME=ci-test-reports,
#   SONAR_SCANNER_CONTAINER=sonar-scanner-ci and SONAR_BUILD_CONTAINER_NAME=advertisement-build-only-ci-sonar, set for
#   every step so manual runs cannot change the jars or reports a CI run uses and cannot remove its containers; each
#   step's own `run:` block sets whatever other env vars the script it calls needs.
# Input: params (unit/integration/e2e/api_flows/sonar/archunit_metrics/lint/shellcheck/docs -- all boolean,
#   gate the matching step via preconditions; teardown_e2e_after -- boolean, default false, tear
#   down e2e's stack after the run; reset_e2e_stack -- boolean, default false, use a full --reset
#   (wipes DB + SeaweedFS together) instead of e2e's default --reset-only-db before deploying
#   (only needed when the DB schema itself changed); reset_ci_cache -- boolean, default false, wipe the CI's own build
#   caches (ci-maven-cache and ci-vaadin-cache) and remove the Sonar scanner container before the build, so the next run
#   downloads dependencies and Node.js again; e2e_args -- string, forwarded to
#   playwright/run.sh).
#   What the sonar stage does depends on unit and integration: both selected -- it imports their
#   JaCoCo reports and runs no tests; sonar alone, or sonar with only one of the two -- it runs its
#   own unit and integration tests first (slower, and a selected unit stage then runs twice); a
#   selected stage that failed -- the sonar stage stops with an error instead of showing lower coverage.
#   When it runs its own tests it uses the Postgres port 25434; the integration stage uses 25433 and manual runs 25432.
# Outputs: PASSED/FAILED per step in Dagu's own web UI and run history. With archunit_metrics
#   enabled, refreshes scripts/build-and-test/reports/architecture-metrics.json.
#   scripts/ci/reports/pipeline-metrics.json is refreshed unconditionally by the pipeline_metrics
#   step, which has no precondition of its own -- not gated by the docs param, only by its
#   upstream stages finishing or skipping. Both files are synced onto the host by
#   scripts/ci/run.sh, not by this DAG itself -- see DECISIONS.md for why. A failing role run of the
#   api_flows stage fails that step; the stage always removes its own stack (ci-api-* names, ports 25435,
#   29001, 29334 and 28081) when it ends.
# Returns: N/A -- Dagu tracks each step's own exit status individually, not one process return code.
# ────────────────────────────────────────────────────────────────────────────
name: ci
working_dir: /app
env:
  - MAVEN_CACHE_VOLUME=ci-maven-cache
  - SONAR_SCANNER_CONTAINER=sonar-scanner-ci
  - VAADIN_CACHE_VOLUME=ci-vaadin-cache
  - TEST_REPORTS_VOLUME=ci-test-reports
  - SONAR_BUILD_CONTAINER_NAME=advertisement-build-only-ci-sonar
params:
  - name: unit
    type: boolean
    default: true
  - name: integration
    type: boolean
    default: true
  - name: reset_e2e_stack
    type: boolean
    default: false
  - name: reset_ci_cache
    type: boolean
    default: false
  - name: e2e_args
    type: string
    default: "e2e --full --ux"
  - name: e2e
    type: boolean
    default: true
  - name: api_flows
    type: boolean
    default: true
  - name: sonar
    type: boolean
    default: true
  - name: archunit_metrics
    type: boolean
    default: true
  - name: lint
    type: boolean
    default: true
  - name: shellcheck
    type: boolean
    default: true
  - name: docs
    type: boolean
    default: true
  - name: teardown_e2e_after
    type: boolean
    default: false

steps:
  # No continue_on: the later stages reuse this build's jars, so a failed build stops the run.
  - id: build
    run: |
      rm -f /tmp/ci-sonar-ok
      RESET_FLAG=""
      if [ "${params.reset_ci_cache}" = "true" ]; then
        RESET_FLAG="--reset-cache"
      fi
      SESSION_ID=$DAG_RUN_ID BUILD_CONTAINER_NAME=advertisement-build-only-ci-build bash scripts/build-and-test.sh $RESET_FLAG --no-unit --no-integration

  - id: unit
    depends: build
    run: SESSION_ID=$DAG_RUN_ID BUILD_CONTAINER_NAME=advertisement-build-only-unit bash scripts/build-and-test.sh --unit --no-integration --skip-vaadin --no-install
    continue_on:
      failure: true
      skipped: true
    preconditions:
      - condition: "${params.unit}"
        expected: "true"

  # --sandbox is always applied here, not a toggleable param -- ci-runner's own DooD nature
  # (Testcontainers spinning up a sibling Postgres container from inside an already-containerized
  # ci-runner) hits the same dynamically-assigned-port unreachability this flag works around
  # regardless of host machine, so there is no real "don't need it" case for this step. See
  # DECISIONS.md.
  # Own fixed Postgres port, so this stage does not share a database with the integration run Sonar does itself when its report import is off.
  - id: integration
    depends: build
    run: |
      SESSION_ID=$DAG_RUN_ID BUILD_CONTAINER_NAME=advertisement-build-only-integration \
        INTEGRATION_TESTS_POSTGRES_FIXED_PORT=25433 \
        bash scripts/build-and-test.sh --no-unit --integration --skip-vaadin --sandbox --no-install
    continue_on:
      failure: true
      skipped: true
    preconditions:
      - condition: "${params.integration}"
        expected: "true"

  - id: e2e
    depends: build
    run: |
      export SESSION_ID=$DAG_RUN_ID
      teardown() {
        [ "${params.teardown_e2e_after}" = "false" ] && return
        docker rm -f ci-marketplace-app ci-advertisement-db ci-advertisement-seaweedfs 2>/dev/null || true
        docker network rm ci-advertisement 2>/dev/null || true
        docker volume rm ci_advertisement_postgres_data ci_advertisement_seaweedfs_data 2>/dev/null || true
      }
      trap teardown EXIT
      RESET_FLAG="--reset-only-db"
      [ "${params.reset_e2e_stack}" = "true" ] && RESET_FLAG="--reset"
      NETWORK=ci-advertisement DB_CONTAINER=ci-advertisement-db SEAWEEDFS_CONTAINER=ci-advertisement-seaweedfs \
        APP_CONTAINER=ci-marketplace-app APP_IMAGE=marketplace-app-ci \
        DB_PORT=15432 SEAWEEDFS_PORT=19000 SEAWEEDFS_CONSOLE_PORT=19333 APP_PORT=18081 \
        DB_VOLUME=ci_advertisement_postgres_data SEAWEEDFS_VOLUME=ci_advertisement_seaweedfs_data \
        bash scripts/deploy-and-run.sh "$RESET_FLAG" --dev-tools --reuse-jar
      APP_URL=http://localhost:18081 APP_CONTAINER=ci-marketplace-app \
        PW_CONTAINER=ci-pw-runner DB_PORT=15432 \
        bash playwright/run.sh ${params.e2e_args}
    continue_on:
      failure: true
      skipped: true
    preconditions:
      - condition: "${params.e2e}"
        expected: "true"

  # Own stack, not the e2e one: both stages need an empty database and run at the same time.
  - id: api_flows
    depends: build
    run: |
      export SESSION_ID=$DAG_RUN_ID
      teardown() {
        docker rm -f ci-api-marketplace-app ci-api-advertisement-db ci-api-advertisement-seaweedfs 2>/dev/null || true
        docker network rm ci-api-advertisement 2>/dev/null || true
        docker volume rm ci_api_advertisement_postgres_data ci_api_advertisement_seaweedfs_data ci-api-marketplace-app-jar 2>/dev/null || true
      }
      trap teardown EXIT
      teardown
      NETWORK=ci-api-advertisement DB_CONTAINER=ci-api-advertisement-db SEAWEEDFS_CONTAINER=ci-api-advertisement-seaweedfs \
        APP_CONTAINER=ci-api-marketplace-app APP_IMAGE=marketplace-app-ci-api \
        DB_PORT=25435 SEAWEEDFS_PORT=29001 SEAWEEDFS_CONSOLE_PORT=29334 APP_PORT=28081 \
        DB_VOLUME=ci_api_advertisement_postgres_data SEAWEEDFS_VOLUME=ci_api_advertisement_seaweedfs_data \
        bash scripts/deploy-and-run.sh --reset-only-db --dev-tools --reuse-jar
      API_FLOWS_FAILED=0
      bash docs/api-collections/api-collection-tests.sh --base-url http://localhost:28081 --each-role || API_FLOWS_FAILED=1
      bash docs/api-collections/api-collection-tests.sh --base-url http://localhost:28081 --config scripts/mcp-collection.config.json --each-role || API_FLOWS_FAILED=1
      exit $API_FLOWS_FAILED
    continue_on:
      failure: true
      skipped: true
    preconditions:
      - condition: "${params.api_flows}"
        expected: "true"

  # Imports the unit and integration stages' JaCoCo reports when both ran, instead of running the tests again.
  # A listed stage without the tests.passed marker or without JaCoCo XML makes this stage fail with an error, never a silent lower coverage.
  - id: sonar
    depends: [unit, integration]
    run: |
      rm -f /tmp/ci-sonar-ok
      if [ "${params.unit}" = "true" ] && [ "${params.integration}" = "true" ]; then
        export SONAR_JACOCO_FROM="advertisement-build-only-unit advertisement-build-only-integration"
      fi
      # Own Postgres port for the case where this stage runs its own integration tests.
      export INTEGRATION_TESTS_POSTGRES_FIXED_PORT=25434
      # The build step already installed the reactor; an own-tests run here must not install it again while the e2e stage reads the jar.
      export SONAR_BUILD_ARGS=--no-install
      SESSION_ID=$DAG_RUN_ID bash scripts/sonar.sh
      touch /tmp/ci-sonar-ok
    continue_on:
      failure: true
      skipped: true
    preconditions:
      - condition: "${params.sonar}"
        expected: "true"

  # On by default -- cheap compared to e2e, feeds docs/architecture/scripts/generate-architecture-model.sh
  # --with-archunit (module coupling metrics).
  - id: archunit_metrics
    depends: build
    run: |
      SESSION_ID=$DAG_RUN_ID BUILD_CONTAINER_NAME=advertisement-build-only-archunit \
        bash scripts/build-and-test.sh --no-unit --no-integration --archunit-metrics --skip-vaadin --no-install
    continue_on:
      failure: true
      skipped: true
    preconditions:
      - condition: "${params.archunit_metrics}"
        expected: "true"

  # No app/DB needed at all -- delegates entirely to playwright/run.sh --lint, which manages its
  # own pw-runner container (Node.js lives there, not in this ci-runner image).
  - id: lint
    depends: build
    run: PW_CONTAINER=ci-pw-runner bash playwright/run.sh --lint
    continue_on:
      failure: true
      skipped: true
    preconditions:
      - condition: "${params.lint}"
        expected: "true"

  # --severity=error only -- warning/info/style findings (this repo currently has a handful,
  # e.g. SC2154/SC2010/SC2086) never fail this gate, only a real correctness-shaped bug does.
  # shellcheck itself is baked into this image (scripts/ci/Dockerfile), unlike lint's Node.js
  # dependency which lives in pw-runner -- no other container to delegate to here.
  - id: shellcheck
    depends: build
    run: |
      find scripts playwright docs/architecture/scripts backlog/research/tools/scripts .claude/commands -name '*.sh' -not -path '*/node_modules/*' -print0 \
        | xargs -0 shellcheck --severity=error
    continue_on:
      failure: true
      skipped: true
    preconditions:
      - condition: "${params.shellcheck}"
        expected: "true"

  # Both this step's own output (scripts/ci/reports/pipeline-metrics.json) and
  # archunit_metrics' output (scripts/build-and-test/reports/architecture-metrics.json) exist only
  # inside this container's own filesystem at this point -- `docker cp` cannot pull them onto the
  # real host from *inside* a DAG step (its "local" side resolves inside this container's own
  # filesystem too, even with docker.sock mounted -- confirmed directly, not assumed). run.sh
  # copies both out from the real host side after this DAG run finishes instead.
  - id: pipeline_metrics
    depends: [unit, integration, e2e, api_flows, sonar, archunit_metrics, lint, shellcheck]
    run: |
      mkdir -p scripts/ci/reports
      python3 scripts/ci/dagu/pipeline-metrics.py > scripts/ci/reports/pipeline-metrics.json
    continue_on:
      failure: true

  - id: docs
    depends: [pipeline_metrics]
    run: |
      bash .claude/nav/scripts/check-flows-completeness.sh
      bash .claude/nav/scripts/check-hardcoded-counts.sh
      SONAR_FLAG=""
      # The Sonar rescan is skipped only when this run's Sonar stage passed.
      [ "${params.sonar}" = "true" ] && SONAR_FLAG="--with-sonar"
      [ "${params.sonar}" = "true" ] && [ -f /tmp/ci-sonar-ok ] && SONAR_FLAG="$SONAR_FLAG --no-sonar-rescan"
      ARCHUNIT_FLAG=""
      [ "${params.archunit_metrics}" = "true" ] && ARCHUNIT_FLAG="--with-archunit"
      bash docs/architecture/scripts/generate-architecture-model.sh $SONAR_FLAG $ARCHUNIT_FLAG
    continue_on:
      failure: true
    preconditions:
      - condition: "${params.docs}"
        expected: "true"
