# ── Header ──────────────────────────────────────────────────────────────────
# Description: Application service for production-build verification via raw docker-compose,
#   independent of scripts/deploy-and-run.sh -- builds from the repo-root Dockerfile directly.
#   Publishes on port 8080 (scripts/deploy-and-run.sh's own build publishes on 8081 instead, to
#   coexist with this file). The production hosting provider ignores this file entirely and builds
#   from the repo-root Dockerfile directly -- this file exists for local production-build
#   verification and the Neon/Supabase Storage variant below, not for deploying.
# Usage: docker compose --project-directory . -f scripts/deploy-and-run/docker-compose.db.yml
#     -f scripts/deploy-and-run/docker-compose.minio.yml
#     -f scripts/deploy-and-run/docker-compose.app.yml up --build
#   (--project-directory required -- see docker-compose.db.yml's own header)
#   Neon DB + Supabase Storage (no local DB/MinIO needed, uncomment the env vars below first):
#     docker-compose -f scripts/deploy-and-run/docker-compose.app.yml up --build
# Uses: repo-root Dockerfile (full multi-stage build, not the thin scripts/deploy-and-run/Dockerfile).
# Env: DB_NAME, DB_USER, DB_PASSWORD, S3_BUCKET, S3_ACCESS_KEY, S3_SECRET_KEY, S3_REGION, S3_PORT
#   -- read from the repo-root .env. DB_PORT/S3_ENDPOINT's internal container ports (5432/9000)
#   are deliberately hardcoded, not parameterized -- see the inline comment below.
# Input: repo-root .env, repo source (Dockerfile build context).
# Outputs: app container, publishing 8080 -> 8080, depending on db+minio being healthy (omit this
#   file's depends_on when running standalone against Neon/Supabase Storage instead).
# ────────────────────────────────────────────────────────────────────────────
version: '3.8'

services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: db
      # DB_PORT/S3_ENDPOINT's port here are the containers' own internal Docker-network ports
      # (always 5432/9000 regardless of the host-side ${DB_PORT}/${S3_PORT} mapping below) --
      # deliberately left literal, not parameterized from .env.
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      # Uncomment for Neon:
      # DB_HOST: ep-late-flower-a43sj7qz-pooler.us-east-1.aws.neon.tech
      # DB_NAME: neondb
      # DB_USER: neondb_owner
      # DB_PASSWORD: your_password
      # DB_SSL_PARAMS: "?sslmode=require&channel_binding=require"
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_REGION: ${S3_REGION}
      S3_PUBLIC_URL: http://localhost:${S3_PORT}/${S3_BUCKET}
      # Uncomment for Supabase Storage:
      # S3_ENDPOINT: https://<project-ref>.supabase.co/storage/v1/s3
      # S3_BUCKET: advertisement
      # S3_ACCESS_KEY: your_supabase_access_key
      # S3_SECRET_KEY: your_supabase_secret_key
      # S3_REGION: auto
      # S3_PUBLIC_URL: https://<project-ref>.supabase.co/storage/v1/object/public/advertisement
    ports:
      - "8080:8080"
    # NOTE: depends_on references services from scripts/deploy-and-run/docker-compose.db.yml and scripts/deploy-and-run/docker-compose.minio.yml.
    # Use this file together with those files (see commands above).
    # When deploying with Neon + Supabase Storage, omit this file's depends_on by running the app standalone.
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
