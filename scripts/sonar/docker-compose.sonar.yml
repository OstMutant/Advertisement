# ── Header ──────────────────────────────────────────────────────────────────
# Description: Defines the local SonarQube server container (sonarqube:community, port 9099) that
#   scripts/sonar/run.sh's scanner uploads analysis to.
# Usage: docker compose -f scripts/sonar/docker-compose.sonar.yml up -d -- not invoked directly in
#   normal use, run.sh owns this container's full lifecycle (pull/create/recreate/start).
# Uses: docker compose; sonarqube:community base image.
# Env: SONAR_ES_BOOTSTRAP_CHECKS_DISABLE=true (Elasticsearch bootstrap checks off, needed for the
#   embedded DB on a typical dev machine's resource limits).
# Input: None (self-contained service definition).
# Outputs: a running `sonarqube` container; dashboard at http://localhost:9099 once up.
# ────────────────────────────────────────────────────────────────────────────

services:
  sonarqube:
    image: sonarqube:community
    container_name: sonarqube
    ports:
      - "9099:9000"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_logs:/opt/sonarqube/logs
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_temp:/opt/sonarqube/temp
    environment:
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    restart: unless-stopped

volumes:
  sonarqube_data:
  sonarqube_logs:
  sonarqube_extensions:
  sonarqube_temp:
